<svg viewBox="0 0 300 80"
     width="100%"
     height="100%"
     xmlns="http://www.w3.org/2000/svg"
     fill="none"
     preserveAspectRatio="xMidYMid meet">

  <!-- Gradients -->
  <defs>
    <linearGradient id="neuroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <linearGradient id="glowGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- CENTER GROUP -->
  <g transform="translate(10,10)">

    <!-- ICON (scaled to text height ~48px) -->
    <g transform="scale(0.7)">
      <circle cx="40" cy="40" r="36" stroke="url(#neuroGradient)" stroke-width="3"/>

      <circle cx="25" cy="30" r="3" fill="#06B6D4"/>
      <circle cx="55" cy="25" r="3" fill="#22C55E"/>
      <circle cx="60" cy="50" r="3" fill="#4F46E5"/>
      <circle cx="30" cy="55" r="3" fill="#06B6D4"/>

      <path d="M25 30 L55 25 L60 50 L30 55 Z"
            stroke="url(#glowGradient)" stroke-width="2" fill="none"/>

      <path d="M20 40 L50 20 L42 40 L60 40 L30 60 L38 40 Z"
            fill="url(#neuroGradient)" opacity="0.9"/>
    </g>

    <!-- TEXT GROUP (aligned center vertically with icon) -->
    <g transform="translate(60,30)">
      <text x="0" y="0"
            font-family="Segoe UI, Inter, Arial, sans-serif"
            font-size="32"
            font-weight="600"
            fill="url(#neuroGradient)"
            dominant-baseline="middle">
        Neuro<tspan font-weight="700">Swift</tspan>
      </text>

      <!-- Tagline -->
      <text x="2" y="20"
            font-family="Segoe UI, Inter, Arial, sans-serif"
            font-size="11"
            fill="#94A3B8">
        Intelligent • Fast • Scalable AI
      </text>
    </g>

  </g>

</svg>