[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroswift"
dynamic = ["version"]
description = "World-class multimodal deep learning: CPU+GPU, SSM+MoE+Plasticity+CrossModalAttention, text/image/audio/video generation with auto-training."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Vikash Kumar" }
]
keywords = ["llm", "ssm", "moe", "hebbian-learning", "cpu-inference", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4.0",
  "numpy>=1.26.0",
  "einops>=0.7.0",
  "transformers>=4.44.0",
  "safetensors>=0.4.3",
  "requests>=2.32.0",
  "PyYAML>=6.0.2",
  "Pillow>=10.4.0",
  "openpyxl>=3.1.5",
  "imageio>=2.37.0",
  "soundfile>=0.13.1",
]

[project.urls]
Homepage = "https://github.com/vikukumar/neuroswift"
Repository = "https://github.com/vikukumar/neuroswift"
Issues = "https://github.com/vikukumar/neuroswift/issues"

[project.scripts]
neuroswift = "neuroswift.__main__:main"

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "twine>=5.1.0",
]
omni = [
  "requests>=2.32.0",
  "PyYAML>=6.0.2",
  "Pillow>=10.4.0",
  "openpyxl>=3.1.5",
  "imageio>=2.37.0",
  "soundfile>=0.13.1",
]
auto = [
  "watchdog>=4.0.0",
]
gpu = [
  "triton>=2.3.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["neuroswift*"]

[tool.setuptools.package-data]
neuroswift = ["py.typed"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
