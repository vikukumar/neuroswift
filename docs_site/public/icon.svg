<svg width="100%" height="100%" viewBox="0 0 80 80"
     xmlns="http://www.w3.org/2000/svg"
     fill="none"
     preserveAspectRatio="xMidYMid meet">

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="neuroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <linearGradient id="glowGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Centered Icon -->
  <g>

    <!-- Outer Circle -->
    <circle cx="40" cy="40" r="36"
            stroke="url(#neuroGradient)" stroke-width="3"/>

    <!-- Neural Nodes -->
    <circle cx="25" cy="30" r="3" fill="#06B6D4"/>
    <circle cx="55" cy="25" r="3" fill="#22C55E"/>
    <circle cx="60" cy="50" r="3" fill="#4F46E5"/>
    <circle cx="30" cy="55" r="3" fill="#06B6D4"/>

    <!-- Connections -->
    <path d="M25 30 L55 25 L60 50 L30 55 Z"
          stroke="url(#glowGradient)" stroke-width="2" fill="none"/>

    <!-- Swift Arrow -->
    <path d="M20 40 L50 20 L42 40 L60 40 L30 60 L38 40 Z"
          fill="url(#neuroGradient)" opacity="0.9"/>

  </g>

</svg>