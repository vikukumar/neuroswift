<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Silicon Blue Mesh Background -->
  <defs>
    <linearGradient id="ns_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/> <!-- Silicon Blue -->
      <stop offset="1" stop-color="#7C3AED"/> <!-- Deep Violet -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Neural Anchor -->
  <path d="M256 64L412 160V352L256 448L100 352V160L256 64Z" stroke="url(#ns_grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Dynamic Thinking Gate (NS Monogram) -->
  <path d="M180 340V172L332 340V172" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- "God-Mode" Signal Strands -->
  <circle cx="256" cy="64" r="8" fill="#0EA5E9" filter="url(#glow)" />
  <circle cx="412" cy="160" r="8" fill="#0EA5E9" />
  <circle cx="412" cy="352" r="8" fill="#7C3AED" />
  <circle cx="256" cy="448" r="8" fill="#7C3AED" filter="url(#glow)" />
  <circle cx="100" cy="352" r="8" fill="#7C3AED" />
  <circle cx="100" cy="160" r="8" fill="#0EA5E9" />

  <!-- Speed/Flash Lines -->
  <path d="M400 256H480" stroke="url(#ns_grad)" stroke-width="4" stroke-linecap="round" />
  <path d="M30 256H110" stroke="url(#ns_grad)" stroke-width="4" stroke-linecap="round" />
</svg>
